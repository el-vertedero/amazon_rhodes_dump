[
zone soc_thermal
gov trip_step_wise
trip 87000 90000 92000 94000 96000 100000 105000*SHUTDOWN
hyst 2000 2000 2000 2000 2000 4000 0
cdevs thermal-cpufreq-0 thermal-cpucore-0 thermal-gpufreq-0 thermal-gpucore-0 wifi audio_cooler dummy_cooler
poll 1000
#Valid values for thermal-cpufreq-0 are: 500000 666000 1000000 1200000 1392000 1512000 1608000 1704000 1800000 1896000 2016000 2208000
thermal-cpufreq-0 2208000 2016000 1896000 1800000 1704000 1512000 1200000
#Valid values for thermal-cpucore-0 are: 0 1 2 3 4
thermal-cpucore-0 0 0 1 2 2 3 4
#Valid values for thermal-gpufreq-0 are: 800 666 500 400 285 125
thermal-gpufreq-0 800 800 666 666 500 400 400
#Valid values for thermal-gpucore-0 are: 0 1 2
thermal-gpucore-0 0 0 1 1 2 2 2
#Valid values for wifi are: 0 1 2 3
wifi 0 0 0 1 1 2 2
audio_cooler 0 1 1 2 2 2 2
dummy_cooler 1 2 3 4 5 6 0
ucase video-call generic
video-call fps video_resolution app_safety_shutdown audio_only
video-call::fps 30 24 15 10 10 10 10
video-call::video_resolution 720 540 540 540 540 360 360
video-call::audio_only 0 0 0 1 1 1 1
video-call::app_safety_shutdown 0 0 0 0 1 1 1
generic warning_display secondaryww
generic::warning_display 0 0 0 0 0 0 1
generic::secondaryww 0 0 0 0 1 1 1
]
[
zone display_soc_virtual
gov trip_step_wise
trip  43000 45000 47000 49000 51000 53000 56000
cdevs thermal-cpufreq-0 thermal-cpucore-0 thermal-gpufreq-0 thermal-gpucore-0 dummy_cooler
thermal-cpufreq-0 2208000 2208000 2016000 1896000 1800000 1512000 1512000
thermal-cpucore-0 0 0 0 0 1 3 3
thermal-gpufreq-0 800 800 800 666 500 400 400
thermal-gpucore-0 0 0 0 0 1 2 2
dummy_cooler 1 2 3 4 5 6 7
ucase generic
generic warning_display
generic::warning_display 0 0 0 0 0 0 1
hyst 2000 2000 2000 2000 2000 2000 0
poll 1000
shutdown_wait 10000
]
[
zone display_cov_virtual
gov trip_step_wise
cdevs lcd-backlight0 dummy_cooler
